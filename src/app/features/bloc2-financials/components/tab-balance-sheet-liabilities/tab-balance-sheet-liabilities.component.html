<form [formGroup]="liabilitiesForm" class="flex flex-col pt-2 pb-8">
  <!-- Equity -->
  <div class="flex flex-col">
    <h3
      class="font-semibold text-[color:var(--color-content-secondary)] uppercase text-xs tracking-wider mb-2"
    >
      Equity
    </h3>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Share Capital</label>
      <input type="number" formControlName="shareCapital" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Reserves</label>
      <input type="number" formControlName="reserves" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Retained Earnings (Prior)</label>
      <input type="number" formControlName="retainedEarningsPrior" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Current Year Earnings</label>
      <input type="number" formControlName="currentYearEarnings" placeholder="0.00" class="finaces-data-pill" />
    </div>
  </div>

  <!-- Non-Current Liabilities -->
  <div class="flex flex-col mt-6">
    <h3
      class="font-semibold text-[color:var(--color-content-secondary)] uppercase text-xs tracking-wider mb-2"
    >
      Non-Current Liabilities
    </h3>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Long-Term Financial Debt</label>
      <input type="number" formControlName="longTermDebt" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Long-Term Provisions</label>
      <input type="number" formControlName="longTermProvisions" placeholder="0.00" class="finaces-data-pill" />
    </div>
  </div>

  <!-- Current Liabilities -->
  <div class="flex flex-col mt-6">
    <h3
      class="font-semibold text-[color:var(--color-content-secondary)] uppercase text-xs tracking-wider mb-2"
    >
      Current Liabilities
    </h3>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Short-Term Financial Debt</label>
      <input type="number" formControlName="shortTermDebt" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Accounts Payable</label>
      <input type="number" formControlName="accountsPayable" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Tax &amp; Social Liabilities</label>
      <input type="number" formControlName="taxAndSocialLiabilities" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Other Current Liabilities</label>
      <input type="number" formControlName="otherCurrentLiabilities" placeholder="0.00" class="finaces-data-pill" />
    </div>
  </div>

  <!-- Total -->
  <div class="finaces-data-row finaces-data-row--total">
    <span class="text-base font-bold text-[color:var(--color-content-primary)] uppercase">Total Liabilities &amp; Equity</span>
    <span class="text-xl font-bold text-[color:var(--color-warning)] text-right pr-4">{{
      totalLiabilities() | number: '1.0-2'
    }}</span>
  </div>
</form>

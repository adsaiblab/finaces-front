<form [formGroup]="pnlForm" class="flex flex-col pt-2 pb-8">
  <div class="flex flex-col">

    <div class="finaces-data-row">
      <label class="text-sm font-semibold text-[color:var(--color-content-primary)]">Revenue (Sales)</label>
      <input type="number" formControlName="revenue" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Sold Production</label>
      <input type="number" formControlName="soldProduction" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Other Operating Income</label>
      <input type="number" formControlName="otherOperatingIncome" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Consumed Purchases</label>
      <input type="number" formControlName="consumedPurchases" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">External Expenses</label>
      <input type="number" formControlName="externalExpenses" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Personnel Expenses</label>
      <input type="number" formControlName="personnelExpenses" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Taxes &amp; Duties</label>
      <input type="number" formControlName="taxesAndDuties" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Depreciation &amp; Amortization</label>
      <input type="number" formControlName="depreciationAmortization" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <!-- Operating Income (Calculated) -->
    <div class="finaces-data-row">
      <span class="text-sm font-bold text-[color:var(--color-content-primary)]">Operating Income</span>
      <span class="text-sm font-bold text-[color:var(--color-content-primary)] text-right pr-4">{{ operatingIncome() | number: '1.2-2' }}</span>
    </div>

    <!-- EBITDA (Calculated) -->
    <div class="finaces-data-row">
      <span class="text-sm font-bold text-[color:var(--color-content-primary)]">EBITDA</span>
      <span class="text-sm font-bold text-[color:var(--color-content-primary)] text-right pr-4">{{ ebitda() | number: '1.0-2' }}</span>
    </div>

    <div class="finaces-data-row" style="margin-top: 1rem">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Financial Income</label>
      <input type="number" formControlName="financialIncome" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Financial Expenses</label>
      <input type="number" formControlName="financialExpenses" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <!-- Net Financial Result (Calculated) -->
    <div class="finaces-data-row">
      <span class="text-sm font-bold text-[color:var(--color-content-primary)]">Net Financial Result</span>
      <span class="text-sm font-bold text-[color:var(--color-content-primary)] text-right pr-4">{{ netFinancialResult() | number: '1.0-2' }}</span>
    </div>

    <!-- Ordinary Income (Calculated) -->
    <div class="finaces-data-row">
      <span class="text-sm font-bold text-[color:var(--color-content-primary)]">Ordinary Income</span>
      <span class="text-sm font-bold text-[color:var(--color-content-primary)] text-right pr-4">{{ ordinaryIncome() | number: '1.0-2' }}</span>
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Exceptional Income (Expense)</label>
      <input type="number" formControlName="exceptionalIncome" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Income Tax</label>
      <input type="number" formControlName="incomeTax" placeholder="0.00" class="finaces-data-pill" />
    </div>

    <!-- NET INCOME -->
    <div class="finaces-data-row finaces-data-row--total">
      <span class="text-base font-bold text-[color:var(--color-content-primary)] uppercase">Net Income</span>
      <span class="text-xl font-bold text-[color:var(--color-primary)] text-right pr-4">{{ netIncome() | number: '1.0-2' }}</span>
    </div>

  </div>
</form>

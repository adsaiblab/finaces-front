<form [formGroup]="cashFlowForm" class="flex flex-col pt-2 pb-8">

    <div class="flex flex-col">

        <!-- CFO -->
        <div class="grid grid-cols-[1fr_200px] items-center py-2.5 border-b border-[color:var(--color-border-default)] hover:bg-[color:var(--color-surface-hover)] px-2 transition-colors">
            <label class="text-[15px] text-[color:var(--color-content-primary)]">Operating Cash Flow (CFO)</label>
            <input type="number" formControlName="operatingActivities" placeholder="0.00" class="finaces-data-pill">
        </div>

        <!-- CFI -->
        <div class="grid grid-cols-[1fr_200px] items-center py-2.5 border-b border-[color:var(--color-border-default)] hover:bg-[color:var(--color-surface-hover)] px-2 transition-colors">
            <label class="text-[15px] text-[color:var(--color-content-primary)]">Investing Cash Flow (CFI)</label>
            <input type="number" formControlName="investingActivities" placeholder="0.00" class="finaces-data-pill">
        </div>

        <!-- CFF -->
        <div class="grid grid-cols-[1fr_200px] items-center py-2.5 border-b border-[color:var(--color-border-default)] hover:bg-[color:var(--color-surface-hover)] px-2 transition-colors">
            <label class="text-[15px] text-[color:var(--color-content-primary)]">Financing Cash Flow (CFF)</label>
            <input type="number" formControlName="financingActivities" placeholder="0.00" class="finaces-data-pill">
        </div>

        <!-- CAPEX -->
        <div class="grid grid-cols-[1fr_200px] items-center py-2.5 border-b border-[color:var(--color-border-default)] hover:bg-[color:var(--color-surface-hover)] px-2 transition-colors">
            <label class="text-[15px] text-[color:var(--color-content-primary)]">CAPEX</label>
            <input type="number" formControlName="capex" placeholder="0.00" class="finaces-data-pill">
        </div>

        <!-- Beginning Cash Balance -->
        <div class="grid grid-cols-[1fr_200px] items-center py-2.5 border-b border-[color:var(--color-border-default)] hover:bg-[color:var(--color-surface-hover)] px-2 transition-colors">
            <label class="text-[15px] text-[color:var(--color-content-primary)]">Beginning Cash Balance</label>
            <input type="number" formControlName="beginningCashBalance" placeholder="0.00" class="finaces-data-pill">
        </div>

        <!-- Change in Cash (Calculated) -->
        <div class="grid grid-cols-[1fr_200px] items-center py-4 border-b border-[color:var(--color-border-default)] px-2 mt-2">
            <span class="text-sm font-bold text-[color:var(--color-content-primary)]">Change in Cash</span>
            <span class="text-sm font-bold text-[color:var(--color-content-primary)] text-right pr-4">{{ changeInCash() | number:'1.2-2' }}</span>
        </div>

        <!-- ENDING CASH BALANCE -->
        <div class="grid grid-cols-[1fr_200px] items-center py-6 px-2 mt-4 border-t-2 border-[color:var(--color-primary)]">
            <span class="text-base font-bold text-[color:var(--color-content-primary)] uppercase">Ending Cash Balance</span>
            <span class="text-xl font-bold text-[color:var(--color-primary)] text-right pr-4">{{ endingCashBalance() | number:'1.2-2' }}</span>
        </div>

    </div>
</form>

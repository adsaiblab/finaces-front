<form [formGroup]="assetsForm" class="flex flex-col pt-2 pb-8">
  <div class="flex flex-col">
    <h3
      class="font-semibold text-[color:var(--color-content-secondary)] uppercase text-xs tracking-wider mb-2"
    >
      Non-Current Assets
    </h3>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Intangible Assets</label>
      <input
        type="number"
        formControlName="intangibleAssets"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]"
        >Property, Plant &amp; Equipment</label
      >
      <input
        type="number"
        formControlName="tangibleAssets"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Financial Assets</label>
      <input
        type="number"
        formControlName="financialAssets"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]"
        >Other Non-Current Assets</label
      >
      <input
        type="number"
        formControlName="otherNonCurrentAssets"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>
  </div>

  <div class="flex flex-col mt-6">
    <h3
      class="font-semibold text-[color:var(--color-content-secondary)] uppercase text-xs tracking-wider mb-2"
    >
      Current Assets
    </h3>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]">Inventory</label>
      <input
        type="number"
        formControlName="inventory"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]"
        >Accounts Receivable</label
      >
      <input
        type="number"
        formControlName="accountsReceivable"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]"
        >Other Current Assets</label
      >
      <input
        type="number"
        formControlName="otherCurrentAssets"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>

    <div class="finaces-data-row">
      <label class="text-[15px] text-[color:var(--color-content-primary)]"
        >Cash &amp; Equivalents</label
      >
      <input
        type="number"
        formControlName="liquidAssets"
        placeholder="0.00"
        class="finaces-data-pill"
      />
    </div>
  </div>

  <div class="finaces-data-row finaces-data-row--total">
    <span class="text-base font-bold text-[color:var(--color-content-primary)] uppercase"
      >Total Assets</span
    >
    <span class="text-xl font-bold text-[color:var(--color-primary)] text-right pr-4">{{
      totalAssets() | number: '1.2-2'
    }}</span>
  </div>
</form>

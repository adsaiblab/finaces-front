<div class="w-full h-full flex flex-col gap-6 p-6 md:p-8 animate-fade-in relative pb-28">

    @if (isLoading()) {
    <div
        class="absolute inset-0 flex flex-col items-center justify-center bg-[color:var(--color-surface-default)] z-10">
        <mat-spinner diameter="50" class="mb-4"></mat-spinner>
        <p class="text-[color:var(--color-content-secondary)] font-medium">Loading Cash Flow Stress Tests...</p>
    </div>
    }

    <header
        class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-[color:var(--color-border-default)] pb-6">
        <div>
            <h1 class="text-2xl font-semibold text-[color:var(--color-content-primary)] flex items-center gap-3">
                <mat-icon class="text-[color:var(--color-primary)]">query_stats</mat-icon>
                Cash Flow Stress Testing
            </h1>
            <p class="text-[color:var(--color-content-secondary)] text-sm mt-1">
                Case #{{ caseId() }} — Evaluate contractual resilience and liquidity risks under delayed payment
                scenarios.
            </p>
        </div>

        <button mat-flat-button color="primary" (click)="runSimulation()" [disabled]="isSimulating()"
            class="finaces-primary-btn">
            @if (isSimulating()) {
            <mat-spinner diameter="20" class="inline-block"></mat-spinner>
            } @else {
            <mat-icon>play_arrow</mat-icon>
            }

            @if (isSimulating()) {
            <span>Simulating...</span>
            } @else {
            <span>Run Simulation</span>
            }
        </button>
    </header>

    <main class="flex flex-col xl:flex-row gap-6 flex-1 items-stretch">

        <div class="flex flex-col gap-6 w-full xl:w-1/3">
            <app-stress-parameters (paramsChange)="updateParams($event)"></app-stress-parameters>
            <app-milestone-timeline (milestonesChange)="updateMilestones($event)"></app-milestone-timeline>
        </div>

        <div class="w-full xl:w-2/3">
            <app-scenario-results [scenarios]="stressData()?.scenarios || []"></app-scenario-results>
        </div>

    </main>

    <div
        class="fixed bottom-0 left-0 right-0 md:left-64 bg-[color:var(--color-surface-card)] border-t border-[color:var(--color-border-default)] p-4 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20 flex justify-between items-center px-6 md:px-12">
        <button mat-button (click)="navigateBack()"
            class="text-[color:var(--color-content-secondary)] hover:text-[color:var(--color-content-primary)]">
            <mat-icon>arrow_back</mat-icon>
            Back to Tension Analysis
        </button>

        <button mat-flat-button color="primary" (click)="proceedToExpert()" class="finaces-primary-btn px-8">
            <span>Proceed to Expert Review</span>
            <mat-icon class="ml-2">arrow_forward</mat-icon>
        </button>
    </div>

</div>

<div class="tension-root" data-testid="tension-root">

  <!-- ─── Skeleton — remplacement du mat-spinner overlay ────────────────────────── -->
  @if (isLoading()) {
    <finaces-skeleton-loader
      variant="detail"
      data-testid="tension-skeleton"
      aria-label="Analyse de divergence MCC / IA en cours"
    />
  }

  <!-- ─── Erreur de chargement forkJoin ──────────────────────────────────────────── -->
  @if (loadError() && !isLoading()) {
    <finaces-inline-error
      [errorCode]="loadError()!"
      [retryCount]="retryCount()"
      testId="tension-load-error"
      (retry)="onRetryLoad()"
      (ignore)="loadError.set(null)"
    />
  }

  <!-- ─── En-tête (toujours visible sauf pendant le loading) ─────────────────────── -->
  @if (!isLoading()) {
    <header class="tension-header" data-testid="tension-header">
      <div>
        <h1 class="tension-title">
          <mat-icon aria-hidden="true">compare_arrows</mat-icon>
          Analyse de Tension MCC / IA
        </h1>
        <p class="tension-subtitle">
          Dossier #{{ caseId() }} — Divergences entre le score MCC officiel et le challenger IA.
        </p>
      </div>
    </header>
  }

  <!-- ─── Contenu principal ───────────────────────────────────────────────────────── -->
  @if (tensionData(); as data) {
    <main class="tension-content" data-testid="tension-main-content">

      <app-tension-banner
        [level]="data.level"
        [direction]="data.direction"
        [deltaScore]="data.delta_score"
        [recommendation]="data.system_recommendation"
        data-testid="tension-banner"
      />

      <app-tension-comparison
        [mccScore]="data.mcc_class === 'MODERATE' ? 3.0 : 3.5"
        [mccClass]="data.mcc_class"
        [iaScore]="data.mcc_class === 'MODERATE' ? 3.0 + data.delta_score : 4.0"
        [iaClass]="data.ia_class"
        [deltaScore]="data.delta_score"
        [classDivergence]="data.class_divergence"
        data-testid="tension-comparison"
      />

      <app-pillar-tension-table
        [pillars]="data.pillars_comparison"
        data-testid="tension-pillars-table"
      />

      <!-- Erreur de soumission décision analyste -->
      @if (submitError()) {
        <finaces-inline-error
          [errorCode]="submitError()!"
          [retryCount]="0"
          testId="tension-submit-error"
          (ignore)="submitError.set(null)"
        />
      }

      <app-analyst-decision
        [requiresJustification]="data.requires_justification"
        (decisionSubmitted)="handleDecision($event)"
        data-testid="tension-analyst-decision"
      />

    </main>

    <!-- ─── Barre de navigation bas ───────────────────────────────────────────── -->
    <div class="tension-bottom-bar" data-testid="tension-bottom-bar">
      <button
        mat-button
        class="tension-back-btn"
        (click)="navigateBack()"
        data-testid="tension-back-btn"
        aria-label="Retour vers l'analyse IA"
      >
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
        Retour au Modèle IA
      </button>

      <span
        class="tension-decision-pending"
        data-testid="tension-decision-pending-label"
        aria-live="polite"
      >
        Décision en attente.
      </span>
    </div>
  }

</div>

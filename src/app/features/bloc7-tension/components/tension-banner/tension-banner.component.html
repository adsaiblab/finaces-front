<div class="flex items-start gap-4 p-5 rounded-lg border-l-4 transition-colors duration-300 shadow-sm"
    [ngClass]="getBannerConfig().classes">

    <mat-icon class="mt-0.5 text-2xl w-8 h-8 flex items-center justify-center">
        {{ getBannerConfig().icon }}
    </mat-icon>

    <div class="flex-1">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-2">
            <h3 class="text-base font-bold uppercase tracking-wider m-0">
                {{ getBannerConfig().title }}
            </h3>

            @if (level() !== 'NONE') {
            <div
                class="flex items-center gap-2 text-sm font-semibold px-3 py-1 rounded bg-surface-card bg-opacity-50 border border-current border-opacity-20">
                <span>Δ Score: {{ deltaScore() | number:'1.2-2' }}</span>
                <span class="opacity-50 mx-1">|</span>
                <span class="text-xs uppercase">{{ getDirectionText() }}</span>
            </div>
            }
        </div>

        <p class="text-sm font-medium text-[color:var(--color-content-primary)] m-0 leading-relaxed">
            <strong class="uppercase text-xs tracking-wider opacity-80 mr-1">System Recommendation:</strong>
            {{ recommendation() }}
        </p>
    </div>
</div>

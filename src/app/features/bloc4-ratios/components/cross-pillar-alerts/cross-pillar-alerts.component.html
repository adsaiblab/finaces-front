@if (alerts() && alerts().length > 0) {
<section class="cross-pillar-alerts mb-8" data-testid="cross-pillar-root">
  <div class="section-header flex items-center gap-3 mb-6 px-2">
    <mat-icon class="text-[color:var(--color-primary)] !text-[28px] !w-[28px] !h-[28px]">psychology</mat-icon>
    <h3 class="text-xl font-bold m-0 text-[color:var(--color-content-primary)] tracking-tight">
      Financial Intelligence Insights
    </h3>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    @for (alert of alerts(); track alert.id) {
      <mat-card 
        class="insight-card !bg-[color:var(--color-surface-card)] !border !shadow-sm transition-all duration-300"
        [ngClass]="getSeverityBorderClass(alert.severity)"
      >
        <mat-card-header class="!pb-0">
          <mat-icon mat-card-avatar [class]="getSeverityIconColor(alert.severity) + ' !text-[32px] !w-[32px] !h-[32px]'">
            {{ getAlertIcon(alert.rule_id) }}
          </mat-icon>
          <mat-card-title class="!text-lg !font-bold !text-[color:var(--color-content-primary)] mt-1">
            {{ alert.rule_id.replace('_', ' ') }}: {{ alert.severity }}
          </mat-card-title>
        </mat-card-header>

        <mat-card-content class="!pt-4">
          <p class="text-[color:var(--color-content-primary)] leading-relaxed m-0">
            <strong [ngClass]="getSeverityTextColor(alert.severity)">{{ alert.message }}</strong>
            <br />
            <span
              class="block mt-3 font-medium p-3 rounded"
              [ngClass]="getSeverityBgClass(alert.severity)"
            >
              Analysis: {{ alert.rule_description }}
            </span>
          </p>
        </mat-card-content>
      </mat-card>
    }
  </div>
</section>
}

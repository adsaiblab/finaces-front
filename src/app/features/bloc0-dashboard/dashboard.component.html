<div class="dashboard-container">

    <div class="dashboard-header">
        <div class="title-wrapper">
            <h1>{{ UI_LABELS.dashboard.title }}</h1>
            <p>{{ UI_LABELS.dashboard.subtitle }}</p>
        </div>

        <button mat-flat-button color="primary" routerLink="/cases/new"
            class="btn-new-case">
            <mat-icon>add</mat-icon>
            {{ UI_LABELS.dashboard.newCase }}
        </button>
    </div>

    @if (stats$ | async; as stats) {
        <app-kpi-row [stats]="stats" />
    } @else {
        <finaces-skeleton-loader [rows]="4" />
    }

    <div class="dashboard-grid">
        <div class="col-span-2">
            <app-recent-cases-table [cases]="(recentCases$ | async) || []" />
        </div>
        <div>
            <app-active-tensions-card [tensions]="(tensions$ | async) || []" />
        </div>
    </div>

    <div class="chart-section">
        <app-convergence-chart [chartData]="chartData$ | async" />
    </div>

</div>

<h2 mat-dialog-title class="text-content-primary">Model Configuration: {{ data.version }}</h2>
<mat-dialog-content>
  <div
    class="bg-surface-card border border-border-default text-success-default p-4 rounded-md font-mono text-xs overflow-auto max-h-96 whitespace-pre-wrap"
  >
    {{ data.config | json }}
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Close</button>
  <button mat-flat-button color="primary" (click)="downloadConfig()">
    <span class="material-icons mr-1 text-sm">download</span> Export JSON
  </button>
</mat-dialog-actions>

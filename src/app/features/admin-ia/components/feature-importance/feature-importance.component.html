<section class="bg-surface-card border border-border-default rounded-xl shadow-sm p-6 h-full">
  <div class="flex justify-between items-center mb-6">
    <h3 class="text-lg font-bold text-content-primary flex items-center gap-2">
      <span class="material-icons text-primary-default">sort</span>
      Global Feature Importance (SHAP)
    </h3>
  </div>

  <div class="space-y-4">
    @for (f of features(); track f) {
      <div class="flex items-center gap-3">
        <div
          class="w-1/3 text-right text-xs font-medium text-content-secondary truncate"
          [title]="f.feature_name"
          data-testid="shap-feature-name"
        >
          {{ f.feature_name }}
        </div>
        <div class="w-2/3 flex items-center gap-2">
          <div
            class="flex-grow bg-surface-default h-4 rounded-full overflow-hidden flex items-center"
          >
            <div
              class="h-full rounded-full transition-all duration-500"
              [ngClass]="getPillarColor(f.pillar)"
              [style.width.%]="f.importance_score * 100"
            ></div>
          </div>
          <span
            class="text-xs font-bold w-12 text-right"
            [ngClass]="f.direction === 'POSITIVE' ? 'text-success-default' : 'text-error-default'"
            data-testid="shap-feature-score"
          >
            {{ f.direction === 'POSITIVE' ? '+' : '-' }}{{ f.importance_score | number: '1.2-2' }}
          </span>
        </div>
      </div>
    }
  </div>

  <div class="mt-6 flex flex-wrap justify-center gap-3 border-t border-border-default pt-4">
    <span class="flex items-center gap-1 text-xs text-content-secondary"
      ><span class="w-2 h-2 rounded-full bg-blue-500"></span> Liquidity</span
    >
    <span class="flex items-center gap-1 text-xs text-content-secondary"
      ><span class="w-2 h-2 rounded-full bg-purple-500"></span> Solvency</span
    >
    <span class="flex items-center gap-1 text-xs text-content-secondary"
      ><span class="w-2 h-2 rounded-full bg-green-500"></span> Profitability</span
    >
    <span class="flex items-center gap-1 text-xs text-content-secondary"
      ><span class="w-2 h-2 rounded-full bg-orange-500"></span> Capacity</span
    >
    <span class="flex items-center gap-1 text-xs text-content-secondary"
      ><span class="w-2 h-2 rounded-full bg-teal-500"></span> Macro</span
    >
  </div>
</section>

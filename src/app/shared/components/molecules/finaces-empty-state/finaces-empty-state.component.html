<div
  class="flex flex-col items-center justify-center p-8 md:p-12 text-center bg-surface-default border border-dashed border-border-strong rounded-xl"
>
  <div
    class="w-20 h-20 bg-surface-hover rounded-full flex items-center justify-center mb-5 md:w-24 md:h-24 transition-all"
  >
    <span class="material-icons text-content-tertiary text-4xl md:text-5xl">{{ icon() }}</span>
  </div>

  <h3 class="text-xl font-bold text-content-primary mb-2">{{ title() }}</h3>
  <p class="text-sm text-content-secondary max-w-md mb-6 leading-relaxed">{{ description() }}</p>

  @if (ctaText()) {
    <button mat-flat-button [color]="ctaColor()" (click)="onAction()">
      {{ ctaText() }}
    </button>
  }
</div>

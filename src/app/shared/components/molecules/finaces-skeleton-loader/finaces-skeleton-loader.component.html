<div class="w-full animate-pulse">

    @if (variant() === 'card') {
    <div class="bg-surface-card border border-border-default rounded-xl p-6 shadow-sm">
        <div class="h-5 bg-surface-hover rounded w-1/3 mb-4"></div>
        <div class="space-y-3">
            <div class="h-4 bg-surface-hover rounded w-full"></div>
            <div class="h-4 bg-surface-hover rounded w-5/6"></div>
            <div class="h-4 bg-surface-hover rounded w-4/6"></div>
        </div>
    </div>
    }

    @if (variant() === 'table') {
    <div class="bg-surface-card border border-border-default rounded-xl overflow-hidden shadow-sm">
        <div class="h-12 bg-surface-hover border-b border-border-default w-full"></div>
        <div class="divide-y divide-border-default">
            @for (r of iterableRows; track $index) {
            <div class="p-4 flex gap-4">
                <div class="h-4 bg-surface-hover rounded w-1/4"></div>
                <div class="h-4 bg-surface-hover rounded w-1/4"></div>
                <div class="h-4 bg-surface-hover rounded w-1/2"></div>
            </div>
            }
        </div>
    </div>
    }

    @if (variant() === 'chart') {
    <div
        class="bg-surface-card border border-border-default rounded-xl p-6 shadow-sm flex flex-col items-center justify-end h-64 gap-2">
        <div class="w-full flex justify-between items-end h-full px-4 border-b border-border-default pb-2">
            <div class="w-1/6 bg-surface-hover rounded-t h-1/3"></div>
            <div class="w-1/6 bg-surface-hover rounded-t h-2/3"></div>
            <div class="w-1/6 bg-surface-hover rounded-t h-full"></div>
            <div class="w-1/6 bg-surface-hover rounded-t h-1/2"></div>
            <div class="w-1/6 bg-surface-hover rounded-t h-3/4"></div>
        </div>
    </div>
    }

    @if (variant() === 'gauge') {
    <div
        class="bg-surface-card border border-border-default rounded-xl p-6 shadow-sm flex flex-col items-center justify-center">
        <div class="w-32 h-32 rounded-full border-8 border-surface-hover flex items-center justify-center mb-4">
            <div class="h-8 bg-surface-hover rounded w-12"></div>
        </div>
        <div class="h-4 bg-surface-hover rounded w-24"></div>
    </div>
    }

</div>

<div
    class="w-full bg-error-lighter border border-error-default rounded-lg p-3 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
    <div class="flex items-center gap-3">
        <span class="material-icons text-error-dark">error_outline</span>
        <div>
            <h4 class="text-sm font-bold text-error-dark">Data Retrieval Error</h4>
            <p class="text-xs text-error-dark">{{ message() }}</p>
        </div>
    </div>

    <div class="flex items-center gap-2 w-full sm:w-auto shrink-0">
        <button type="button"
            class="px-3 py-1.5 text-xs font-bold rounded text-content-secondary hover:bg-surface-hover transition-colors flex-1 sm:flex-none border border-border-default"
            (click)="onIgnore()">
            Dismiss
        </button>
        <button type="button"
            class="px-3 py-1.5 text-xs font-bold rounded bg-surface-card text-error-dark border border-error-default hover:bg-error-default hover:text-inverse transition-colors flex items-center justify-center gap-1 flex-1 sm:flex-none disabled:opacity-50 disabled:cursor-not-allowed"
            [disabled]="!canRetry" (click)="onRetry()">
            <span class="material-icons text-xs">refresh</span>
            Retry
            @if(maxRetries() > 0) {
            ({{ retryCount() }}/{{ maxRetries() }})
            }
        </button>
    </div>
</div>

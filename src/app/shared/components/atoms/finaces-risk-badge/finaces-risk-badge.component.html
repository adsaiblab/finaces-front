<span [ngClass]="badgeClasses()">
  @if (showIcon() && metadata().icon) {
    <mat-icon class="badge-icon">
      {{ metadata().icon }}
    </mat-icon>
  }
  @if (!isMcc() && showLabel()) {
    <span class="badge-prefix">IA</span>
  }
  @if (showLabel()) {
    <span class="badge-label">
      {{ metadata().label }}
    </span>
  }
</span>

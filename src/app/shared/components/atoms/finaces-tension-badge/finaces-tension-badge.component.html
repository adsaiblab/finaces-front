<div [ngClass]="badgeClasses()">
  <mat-icon class="tension-icon">{{ tensionScheme().icon }}</mat-icon>
  <span class="tension-label">{{ tensionScheme().labelFr }}</span>

  @if (showDirectionDelta()) {
    <span class="tension-delta">
      @if (direction()) {
        <mat-icon class="delta-arrow">{{ directionIcon() }}</mat-icon>
      }
      @if (delta() !== undefined) {
        <span class="delta-value">{{ displayDelta() }}</span>
      }
    </span>
  }
</div>

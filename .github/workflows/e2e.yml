name: E2E Tests — FinaCES

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # ── Backend ──────────────────────────────────────────────────────────
      # ⚠️ postgresql+asyncpg:// obligatoire : alembic/env.py utilise async_engine_from_config
      # postgresql:// (sans driver) force SQLAlchemy à charger psycopg2 → ModuleNotFoundError
      DATABASE_URL: postgresql+asyncpg://finaces:finaces@localhost:5432/finaces_e2e
      SECRET_KEY: ci-secret-key-not-for-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ENVIRONMENT: test
      # ── E2E credentials (matches seed_e2e.py) ────────────────────────────
      E2E_USER_EMAIL: e2e.analyst@finaces.test
      E2E_USER_PASSWORD: E2eFinaCES2026!
      E2E_API_URL: http://localhost:8000
      E2E_FRONTEND_URL: http://localhost:4200

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finaces
          POSTGRES_PASSWORD: finaces
          POSTGRES_DB: finaces_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ── 1. Checkout both repos ────────────────────────────────────────────
      - name: Checkout finaces-front
        uses: actions/checkout@v4
        with:
          path: finaces-front

      - name: Checkout finaces-api
        uses: actions/checkout@v4
        with:
          repository: adsaiblab/finaces-api
          path: finaces-api
          token: ${{ secrets.GH_PAT }}

      # ── 2. Setup Python + backend ─────────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: finaces-api/requirements.txt

      - name: Install backend dependencies
        working-directory: finaces-api
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        working-directory: finaces-api
        run: alembic upgrade head

      - name: Seed E2E test data
        working-directory: finaces-api
        run: python scripts/seed_e2e.py

      - name: Start FastAPI backend
        working-directory: finaces-api
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on :8000..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && echo "Backend ready!" && exit 0
            sleep 2
          done
          echo "Backend failed to start" && exit 1

      # ── 3. Setup Node + frontend ──────────────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: finaces-front/package-lock.json

      - name: Install frontend dependencies
        working-directory: finaces-front
        run: npm ci

      - name: Install Playwright browsers
        working-directory: finaces-front
        run: npx playwright install chromium --with-deps

      - name: Build Angular app (production)
        working-directory: finaces-front
        run: npm run build:ci

      - name: Serve Angular app
        working-directory: finaces-front
        run: |
          npx serve dist/finaces-front/browser -l 4200 --no-clipboard &
          echo $! > /tmp/frontend.pid

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend on :4200..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:4200 && echo "Frontend ready!" && exit 0
            sleep 2
          done
          echo "Frontend failed to start" && exit 1

      # ── 4. Run Playwright E2E ─────────────────────────────────────────────
      - name: Run E2E tests
        working-directory: finaces-front
        run: npm run e2e:ci -- --config=e2e/playwright.config.ts
        env:
          CI: true

      # ── 5. Upload artifacts ───────────────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: finaces-front/playwright-report/
          retention-days: 14

      - name: Upload test results (traces/screenshots/videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.run_number }}
          path: finaces-front/playwright-results/
          retention-days: 7
